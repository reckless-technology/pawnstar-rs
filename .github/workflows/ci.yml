# CI mirrors the C++ repo's gates: a build-and-test job (all suites, including the bench golden
# that locks bit-exact parity with the C++ engine, and the uci_test.sh shell suite), a coverage
# job (90 % of lines, src/bin/ excepted) and a format job (the whole tree must stay
# cargo-fmt-clean, like the C++ clang-format gate). Three more, each documented above its own job
# below: the retired v12 NNUE shape, which no other job builds; the cross-port node-count
# signature over the synthetic net; and the same build and suites on Windows.
#
# Every job runs on a GitHub-hosted image named by its version (ubuntu-24.04, windows-2025),
# which starts empty each time: dtolnay/rust-toolchain brings the stable toolchain that
# rust-toolchain.toml names, and each job installs anything else it needs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags and the history: build.rs derives the version from them
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (release)
        run: cargo build --release --bins
      - name: Test (release, includes bench golden + uci shell suite)
        run: cargo test --release
      # Drives the real BINARY over UCI (the golden test above exercises the library), so it is worth
      # keeping — but it must NOT hardcode a second copy of the signature. It used to, and that copy
      # silently drifted: when the golden was re-blessed 6,888,983 -> 6,601,454 for the depth-weighted
      # history change, this literal was missed and CI stayed red for three commits. Derive it from the
      # single source of truth instead: GOLDEN_TOTAL in tests/bench_golden_test.rs. It has since been
      # re-blessed again, 6,601,454 -> 5,617,906, when net v20 shipped in release 2.0.0 - and this step
      # needed no edit, which is the arrangement working.
      - name: Bench determinism signature
        run: |
          want=$(grep -oP 'GOLDEN_TOTAL:\s*u64\s*=\s*\K[0-9_]+' tests/bench_golden_test.rs | tr -d '_')
          [ -n "$want" ] || { echo "::error::could not read GOLDEN_TOTAL from tests/bench_golden_test.rs"; exit 1; }
          nodes=$(./target/release/pawnstar <<< $'bench\nquit' | grep -Eo '^[0-9]+ nodes' | grep -Eo '[0-9]+')
          echo "bench: $nodes nodes (expected $want)"
          test "$nodes" = "$want"

  # Line coverage of the engine library and the pawnstar binary, gated at 90 %. Every suite runs
  # instrumented, the UCI shell suite and the binary suites included: the binary they spawn is the
  # instrumented one (CARGO_BIN_EXE_pawnstar), and it inherits cargo-llvm-cov's LLVM_PROFILE_FILE,
  # so main.rs and the UCI handlers count. src/bin/ is left out: dump_magics, stamp_net and
  # write_synthetic_net are developer tools run by hand, not the engine. cargo-llvm-cov is built from crates.io at its
  # pinned version and its binary cached under that version, so a run builds it only when the pin moves.
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags and the history: build.rs derives the version from them
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - name: cargo-llvm-cov from the cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: cargo-llvm-cov-0.9.1-${{ runner.os }}-${{ runner.arch }}
      - name: cargo-llvm-cov
        run: |
          want=0.9.1 # and in the cache key above
          if ! cargo llvm-cov --version 2>/dev/null | grep -qx "cargo-llvm-cov $want"; then
            cargo install cargo-llvm-cov --locked --version "$want"
          fi
          cargo llvm-cov --version
      - name: Line coverage (fails under 90 %)
        run: cargo llvm-cov --release --ignore-filename-regex 'src/bin/' --fail-under-lines 90 --summary-only

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  # ---------------------------------------------------------------------------------------------------
  # The RETIRED v12 NNUE SHAPE - mirroring off, one output head - which every job above now leaves
  # entirely untested, because release 2.0.0 made the shared shape (king mirroring + 8 material output
  # heads) the Cargo default and they all exercise the default. This job is the mirror image of the one
  # that stood here before the flip, and it exists for the same reason: a gated path with no CI rots
  # silently, and the cost of that is already measured - pawnstar-go's transposition table defaulted to
  # 512 MB against this port's 64 MB from May until 2026-10-27, through every release, because the only
  # cross-port gate that ran was `bench` and `bench` pins the table to 64 MB in all three. A gate that
  # controls for a difference cannot detect it.
  #
  # There is no trained net of this shape in the tree any more - v12's was removed when 2.0.0 shipped -
  # so the suites whose expected values need one skip and say so (tests/common/mod.rs,
  # is_shipped_net_this_builds_shape, and nnue_container_test's own header-derived shape probe), exactly
  # as they skip when the net file is absent. What still runs is everything shape-independent plus
  # nnue_incremental_test, which builds its own synthetic net at whatever shape the build was configured
  # for. That is what makes this job worth its minutes: it proves the retired shape still compiles and
  # still evaluates self-consistently, which is all anyone can ask of a shape with no net.
  #
  # Its own job rather than a feature matrix on build-test, for three reasons unchanged from before: the
  # default shape's bench golden, its coverage percentage and its node counts must not move, and a matrix
  # would recompute all of them; the two shapes' failures stay distinguishable at a glance, where a matrix
  # leg reads as "the build broke"; and the job runs concurrently with the others, so it adds a name to
  # the list rather than minutes to the critical path. Linux only: the shape is integer arithmetic chosen
  # at compile time, so a Windows leg would double the cost for no new failure mode.
  # ---------------------------------------------------------------------------------------------------
  v12-shape:
    name: retired v12 NNUE shape (no mirroring, one output head)
    runs-on: ubuntu-24.04
    env:
      # A target directory of its own, as nnue/README.md says: not only to keep the two feature sets'
      # artifacts apart, but because MSVC's linker has been seen to fail with LNK1201 on a PDB the other
      # feature set wrote - which it did again when these defaults were flipped. /target-* is gitignored,
      # so the same command works in a developer's checkout.
      CARGO_TARGET_DIR: target-v12shape
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags and the history: build.rs derives the version from them
      - uses: dtolnay/rust-toolchain@stable
      # --no-default-features drops the two shape features AND debugx, so debugx is asked for back by
      # name: this leg is about the shape, not about the diagnostic counters.
      - name: Build (release, retired v12 shape)
        run: cargo build --release --bins --no-default-features --features debugx
      - name: Test (release, retired v12 shape)
        run: |
          set -o pipefail
          cargo test --release --no-default-features --features debugx 2>&1 | tee v12-shape-test.log

  # ---------------------------------------------------------------------------------------------------
  # The CROSS-PORT NODE-COUNT SIGNATURE over the deterministic synthetic net. This is the gate that keeps
  # pawnstar, pawnstar-rs and pawnstar-go bit-exact at the shared shape, and it is independent of which
  # net is shipped: `bench` locks the signature over the *shipped* net (build-test, above), while this
  # locks it over a net generated from nothing, so a net change and a code change cannot be confused for
  # one another.
  #
  # tools/new-shape-signature.sh is committed BYTE-IDENTICALLY in all three repositories (blob
  # 46aad8fe29e64d937e63851a8afba284abc6c7a2, mode 100755): the six expected node counts live in it and
  # nowhere else, so `diff` between the three repos is the whole audit and there is no second copy of the
  # numbers to drift. Its header described the shape as living behind a switch that defaults off, which
  # stopped being true at release 2.0.0; that was corrected on 2026-10-30 in all FOUR copies at once - these
  # three plus nnue-training's pipeline/new-shape-signature.sh - which is the only way that file may be
  # changed, since its byte-identity is what the audit consists of.
  #
  # `--hash` is mandatory in the script and its value is printed beside every node count: table size
  # changes the collision pattern and so the node count at a fixed depth, so a node count with no table
  # size next to it is not comparable - and it was precisely the absence of one that hid the 512-vs-64
  # default. The script asserts the synthetic net's size, SHA-256 and RNNUE1 header BEFORE searching it,
  # so a drifted generator fails as a drifted generator rather than as a search regression.
  # ---------------------------------------------------------------------------------------------------
  shape-signature:
    name: cross-port node-count signature (synthetic net)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags and the history: build.rs derives the version from them
      - uses: dtolnay/rust-toolchain@stable
      # No --features: since release 2.0.0 the default shape IS the shared shape this gate measures.
      - name: Build (release)
        run: cargo build --release --bins
      - name: Write the synthetic net at this build's shape
        run: target/release/write_synthetic_net synthetic-net.bin
      - name: Cross-port node-count signature (six positions, depth 8, Hash 64 MB)
        run: |
          set -o pipefail
          tools/new-shape-signature.sh --hash 64 --net synthetic-net.bin --depth 8 \
              target/release/pawnstar 2>&1 | tee new-shape-signature.log
      - name: Signature in the job summary
        if: always()
        run: |
          [ -f new-shape-signature.log ] || exit 0
          {
            echo '### The shared NNUE shape: cross-port node-count signature'
            echo '```'
            cat new-shape-signature.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Windows x86-64 (MSVC toolchain), on GitHub's Windows Server 2025 image, which carries
  # Visual Studio's C++ build tools for the MSVC linker; dtolnay/rust-toolchain brings the same
  # stable toolchain as on Linux. The shell is Git Bash 5.x, which satisfies the "bash >= 4 with
  # coproc" probe in tests/uci_shell_test.rs — so the shell suite runs here rather than skipping.
  build-test-windows:
    name: build + test (windows x86_64)
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags and the history: build.rs derives the version from them
      - uses: dtolnay/rust-toolchain@stable
      - name: Toolchain
        run: |
          rustc --version
          cargo --version
      - name: Build (release)
        run: cargo build --release --bins
      # The engine imports system DLLs alone: the C runtime is linked statically (.cargo/config.toml), so it starts on a
      # Windows with no Visual C++ redistributable. A C or C++ runtime DLL among its imports fails the job.
      - name: Windows DLLs the engine imports
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/windows-dependents.ps1 target/release/pawnstar.exe
          if ($LASTEXITCODE -ne 0) { throw "the engine imports a DLL outside the allowlist" }
      - name: Test (release, includes bench golden + uci shell suite)
        run: cargo test --release
      # Derived the same way as the Linux job: GOLDEN_TOTAL in tests/bench_golden_test.rs is the
      # single source of truth for the signature — never a second literal here. Running it on
      # Windows too is the point: the signature is a cross-platform bit-parity guarantee.
      - name: Bench determinism signature
        run: |
          want=$(grep -oP 'GOLDEN_TOTAL:\s*u64\s*=\s*\K[0-9_]+' tests/bench_golden_test.rs | tr -d '_')
          [ -n "$want" ] || { echo "::error::could not read GOLDEN_TOTAL from tests/bench_golden_test.rs"; exit 1; }
          nodes=$(./target/release/pawnstar.exe <<< $'bench\nquit' | grep -Eo '^[0-9]+ nodes' | grep -Eo '[0-9]+')
          echo "bench: $nodes nodes (expected $want)"
          test "$nodes" = "$want"