# CI mirrors the C++ repo's gates: a build-and-test job (all suites, including the bench golden
# that locks bit-exact parity with the C++ engine, and the uci_test.sh shell suite), a coverage
# job (90 % of lines, src/bin/ excepted) and a format job (the whole tree must stay
# cargo-fmt-clean, like the C++ clang-format gate).
#
# Every job runs on a GitHub-hosted image named by its version (ubuntu-24.04, windows-2025),
# which starts empty each time: dtolnay/rust-toolchain brings the stable toolchain that
# rust-toolchain.toml names, and each job installs anything else it needs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags and the history: build.rs derives the version from them
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (release)
        run: cargo build --release --bins
      - name: Test (release, includes bench golden + uci shell suite)
        run: cargo test --release
      # Drives the real BINARY over UCI (the golden test above exercises the library), so it is worth
      # keeping — but it must NOT hardcode a second copy of the signature. It used to, and that copy
      # silently drifted: when the golden was re-blessed 6,888,983 -> 6,601,454 for the depth-weighted
      # history change, this literal was missed and CI stayed red for three commits. Derive it from the
      # single source of truth instead: GOLDEN_TOTAL in tests/bench_golden_test.rs.
      - name: Bench determinism signature
        run: |
          want=$(grep -oP 'GOLDEN_TOTAL:\s*u64\s*=\s*\K[0-9_]+' tests/bench_golden_test.rs | tr -d '_')
          [ -n "$want" ] || { echo "::error::could not read GOLDEN_TOTAL from tests/bench_golden_test.rs"; exit 1; }
          nodes=$(./target/release/pawnstar <<< $'bench\nquit' | grep -Eo '^[0-9]+ nodes' | grep -Eo '[0-9]+')
          echo "bench: $nodes nodes (expected $want)"
          test "$nodes" = "$want"

  # Line coverage of the engine library and the pawnstar binary, gated at 90 %. Every suite runs
  # instrumented, the UCI shell suite and the binary suites included: the binary they spawn is the
  # instrumented one (CARGO_BIN_EXE_pawnstar), and it inherits cargo-llvm-cov's LLVM_PROFILE_FILE,
  # so main.rs and the UCI handlers count. src/bin/ is left out: dump_magics and stamp_net are
  # developer tools run by hand, not the engine. cargo-llvm-cov is built from crates.io at its
  # pinned version and its binary cached under that version, so a run builds it only when the pin moves.
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags and the history: build.rs derives the version from them
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - name: cargo-llvm-cov from the cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: cargo-llvm-cov-0.9.1-${{ runner.os }}-${{ runner.arch }}
      - name: cargo-llvm-cov
        run: |
          want=0.9.1 # and in the cache key above
          if ! cargo llvm-cov --version 2>/dev/null | grep -qx "cargo-llvm-cov $want"; then
            cargo install cargo-llvm-cov --locked --version "$want"
          fi
          cargo llvm-cov --version
      - name: Line coverage (fails under 90 %)
        run: cargo llvm-cov --release --ignore-filename-regex 'src/bin/' --fail-under-lines 90 --summary-only

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  # ---------------------------------------------------------------------------------------------------
  # The SHARED NNUE SHAPE — horizontal king mirroring plus 8 material output heads — which every job
  # above leaves entirely untested, because the shape is behind Cargo features that default off and they
  # all exercise the default. That path is about to carry a freshly trained net the whole project
  # depends on, and a gated path with no CI rots silently: pawnstar-go's transposition table defaulted
  # to 512 MB against this port's 64 MB from May until 2026-10-27, through every release, because the
  # only cross-port gate that ran was `bench` and `bench` pins the table to 64 MB in all three. A gate
  # that controls for a difference cannot detect it.
  #
  # Its own job rather than a feature matrix on build-test, for three reasons. The default shape's bench
  # golden, its coverage percentage and its node counts must not move, and a matrix would recompute all
  # of them; the two shapes' failures stay distinguishable at a glance, where a matrix leg reads as "the
  # build broke"; and the job runs concurrently with the others, so it adds a name to the list rather
  # than minutes to the critical path. Linux only: the shape is integer arithmetic chosen at compile
  # time, and the synthetic net is proven byte-identical across platforms (the script asserts its
  # SHA-256 every run), so a Windows leg would double the cost for no new failure mode.
  # ---------------------------------------------------------------------------------------------------
  new-shape:
    name: new NNUE shape (mirroring + 8 output heads)
    runs-on: ubuntu-24.04
    env:
      # A target directory of its own, as nnue/README.md says: not only to keep the two feature sets'
      # artifacts apart, but because MSVC's linker has been seen to fail with LNK1201 on a PDB the other
      # feature set wrote. /target-* is gitignored, so the same command works in a developer's checkout.
      CARGO_TARGET_DIR: target-newshape
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags and the history: build.rs derives the version from them
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (release, nnue-shared-shape)
        run: cargo build --release --bins --features nnue-shared-shape
      # The whole suite at the new shape. The suites whose expected values belong to the shipped v12 net
      # skip there and say so (tests/common/mod.rs, is_shipped_net_this_builds_shape), because a build at
      # this shape rightly refuses that net; nnue_incremental_test instead builds its own synthetic net at
      # whatever shape the build was configured for, which is how a shape with no trained net is tested.
      - name: Test (release, nnue-shared-shape)
        run: |
          set -o pipefail
          cargo test --release --features nnue-shared-shape 2>&1 | tee new-shape-test.log
      - name: Write the synthetic net at this build's shape
        run: target-newshape/release/write_synthetic_net synthetic-net.bin
      # The cross-port gate. `--hash` is mandatory in the script and its value is printed beside every
      # node count: table size changes the collision pattern and so the node count at a fixed depth, so a
      # node count with no table size next to it is not comparable — and it was precisely the absence of
      # one that hid the 512-vs-64 default. The script asserts the synthetic net's size, SHA-256 and
      # RNNUE1 header BEFORE searching it, so a drifted generator fails as a drifted generator rather
      # than as a search regression. The same file, with the same six expected results, is committed in
      # pawnstar and pawnstar-go: three independent assertions against one shared constant, so any port
      # that drifts fails its own CI at its own commit, with no cross-repository fetch to go stale.
      - name: Cross-port node-count signature (six positions, depth 8, Hash 64 MB)
        run: |
          set -o pipefail
          tools/new-shape-signature.sh --hash 64 --net synthetic-net.bin --depth 8 \
              target-newshape/release/pawnstar 2>&1 | tee new-shape-signature.log
      - name: Signature in the job summary
        if: always()
        run: |
          [ -f new-shape-signature.log ] || exit 0
          {
            echo '### The shared NNUE shape: cross-port node-count signature'
            echo '```'
            cat new-shape-signature.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Windows x86-64 (MSVC toolchain), on GitHub's Windows Server 2025 image, which carries
  # Visual Studio's C++ build tools for the MSVC linker; dtolnay/rust-toolchain brings the same
  # stable toolchain as on Linux. The shell is Git Bash 5.x, which satisfies the "bash >= 4 with
  # coproc" probe in tests/uci_shell_test.rs — so the shell suite runs here rather than skipping.
  build-test-windows:
    name: build + test (windows x86_64)
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags and the history: build.rs derives the version from them
      - uses: dtolnay/rust-toolchain@stable
      - name: Toolchain
        run: |
          rustc --version
          cargo --version
      - name: Build (release)
        run: cargo build --release --bins
      # The engine imports system DLLs alone: the C runtime is linked statically (.cargo/config.toml), so it starts on a
      # Windows with no Visual C++ redistributable. A C or C++ runtime DLL among its imports fails the job.
      - name: Windows DLLs the engine imports
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/windows-dependents.ps1 target/release/pawnstar.exe
          if ($LASTEXITCODE -ne 0) { throw "the engine imports a DLL outside the allowlist" }
      - name: Test (release, includes bench golden + uci shell suite)
        run: cargo test --release
      # Derived the same way as the Linux job: GOLDEN_TOTAL in tests/bench_golden_test.rs is the
      # single source of truth for the signature — never a second literal here. Running it on
      # Windows too is the point: the signature is a cross-platform bit-parity guarantee.
      - name: Bench determinism signature
        run: |
          want=$(grep -oP 'GOLDEN_TOTAL:\s*u64\s*=\s*\K[0-9_]+' tests/bench_golden_test.rs | tr -d '_')
          [ -n "$want" ] || { echo "::error::could not read GOLDEN_TOTAL from tests/bench_golden_test.rs"; exit 1; }
          nodes=$(./target/release/pawnstar.exe <<< $'bench\nquit' | grep -Eo '^[0-9]+ nodes' | grep -Eo '[0-9]+')
          echo "bench: $nodes nodes (expected $want)"
          test "$nodes" = "$want"