[package]
name = "pawnstar"
# Not the engine's version, which build.rs derives from the git tags (src/version.rs); a fixed placeholder, so
# nothing here is edited to release.
version = "0.0.0"
edition = "2021"
description = "Pawnstar UCI chess engine — mechanical Rust port of the C++ original"
license = "GPL-3.0-only"

[features]
# Mirrors the C++ DEBUGX flag: diagnostic counters compiled in by default,
# disabled for release builds with --no-default-features (the C++ RELEASE=1).
default = ["debugx"]
debugx = []

# The NNUE network shape, mirroring the C++ PAWNSTAR_NNUE_KING_MIRRORING and
# PAWNSTAR_NNUE_OUTPUT_BUCKETS build knobs, so either shape can be built from one tree while the
# three bit-exact ports (C++, Rust, Go) are brought across one at a time. The defaults are the v12
# shape the shipped net was trained for; the shared architecture is both features together:
#
#   cargo test --release --features nnue-shared-shape
#
# Both are stamped into every net's header (`flags` bit 0, `output_buckets`, and the bucket map's
# CRC-64), and the loader checks all three, so a net can only ever load into a build of its own
# shape — a new-shape build refuses nnue/pawnstar-v12.bin, which is correct, not a fault. A shape
# change is also an evaluation change, so it moves the bench signature and breaks parity with the
# C++ and Go ports until all three are ported together: do not make these default for one engine
# alone.
nnue-king-mirroring = []
nnue-output-buckets-8 = []
nnue-shared-shape = ["nnue-king-mirroring", "nnue-output-buckets-8"]

[lib]
name = "pawnstar"
path = "src/lib.rs"

[[bin]]
name = "pawnstar"
path = "src/main.rs"

[profile.dev]
# Search/perft are unusable at -O0; keep overflow checks to catch missed wrapping ops.
opt-level = 3
overflow-checks = true
debug-assertions = true

[profile.release]
opt-level = 3
overflow-checks = false
codegen-units = 1

[profile.test]
inherits = "dev"
